[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-dev-decision-room-ai"
version = "0.1.0"
description = "Executa for the decision-room-ai Anna App"
requires-python = ">=3.10"

[project.scripts]
"tool-dev-decision-room-ai" = "decision_room_ai_plugin:main"

[tool.setuptools]
py-modules = ["decision_room_ai_plugin"]
